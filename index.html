<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>Fat Loss Coach</title>
<style>
body{font-family:-apple-system,sans-serif;background:#f3f4f6;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
input,textarea{width:100%;padding:8px}
</style></head><body>
<h1>🏃 Fat Loss Coach</h1>
<div class="card">
<h2>Stats</h2>
<input id="weight" placeholder="Weight kg">
<input id="waist" placeholder="Waist inches">
<button onclick="save()">Save</button>
<p id="out"></p>
</div>
<script>
function save(){
localStorage.weight=weight.value;
localStorage.waist=waist.value;
load();
}
function load(){
out.innerHTML="Weight: "+(localStorage.weight||"96")+"kg | Waist: "+(localStorage.waist||"40.5")+"\"";
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
load();
</script>
</body></html>
